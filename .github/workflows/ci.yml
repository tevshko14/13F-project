name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatchling && pip install ".[test]"
      - run: pytest tests/ -v

  typecheck:
    # mypy gate scoped to files that carry TypedDict contracts.
    # Expanding scope is a per-file task: add TypedDicts, fix any
    # drift mypy surfaces, then add the file to this `mypy` invocation.
    # Catches "bounded fallback drifted from template's expected shape"
    # at PR time rather than at template-render time in prod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: |
          mypy --config-file pyproject.toml \
            src/filings/routers/_redesign/congress.py \
            src/filings/routers/_redesign/funds.py \
            src/filings/routers/_redesign/helpers.py \
            src/filings/routers/_redesign/home.py \
            src/filings/routers/_redesign/insiders.py \
            src/filings/routers/_redesign/macro.py \
            src/filings/routers/_redesign/notifications.py \
            src/filings/routers/_redesign/profile_watchlist.py \
            src/filings/routers/_redesign/retail.py \
            src/filings/routers/_redesign/stock.py \
            src/filings/routers/_redesign/support.py

  bounded-coverage:
    # AST-walk lint: every `await to_X(...)` inside a `@router.get`
    # handler must be wrapped in `_bounded` / `_bounded_call`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint_bounded_coverage.py

  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hatchling && pip install .
      - run: |
          python -c "from filings.web import app; print('OK')"
