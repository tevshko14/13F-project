[project]
name = "13f-project"
version = "0.1.0"
description = "CLI tool to view SEC 13F institutional holdings filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.13",
    "rich>=13.0",
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
]

[project.scripts]
filings = "filings.cli:main"
filings-web = "filings.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings"]
