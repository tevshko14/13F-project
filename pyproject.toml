[project]
name = "13f-project"
version = "0.1.0"
description = "CLI tool to view SEC 13F institutional holdings filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.13,<6",
    "rich>=13.0",
    "fastapi[standard]>=0.115,<1",
    "jinja2>=3.1",
    "finnhub-python>=2.4",
    "yfinance>=0.2",
    "slowapi>=0.1.9",
    "gunicorn>=22.0",
    "sentry-sdk[fastapi]>=2.0",
    "supabase>=2.0",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "stripe>=9.0",
    "pytrends>=4.9",
    "brotli>=1.1",
    "resend>=1.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[project.scripts]
filings = "filings.cli:main"
filings-web = "filings.web:main"
filings-worker = "filings.worker:main"
filings-sync = "filings.sync_worker:main"
filings-insider-sync = "filings.insider_sync:main"
filings-congress-sync = "filings.congress_sync:main"
filings-youtube-sync = "filings.youtube_sync:main"
filings-migrate-cold = "filings.migrate_cold_storage:main"
filings-insider-backfill = "filings.insider_backfill:main"
filings-insider-returns = "filings.insider_returns:main"
filings-short-interest-sync = "filings.short_interest_sync:main"
filings-options-sync = "filings.options_sync:main"
filings-digest = "filings.digest_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings"]
artifacts = ["src/filings/static/*", "src/filings/templates/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Default rule selection (E, F) plus warnings.  Skip style rules that
# fight intentional patterns in this codebase: one-line guard clauses
# (`if x: continue`) and deferred imports inside route handlers /
# fetcher closures (we use these to break import cycles).
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long -- visual review, not auto-enforced
    "E701",  # one-line `if x: y` -- preferred for tight guard clauses
    "E702",  # one-line `x; y` -- same
    "E402",  # late imports -- intentional for cycle-breaking + lazy load
    "E741",  # ambiguous var names (l/I/O) -- legacy spots, low value to fix
]

# ── mypy: type-checking, scoped to the redesign sub-router package ──
# We don't yet have the bandwidth to clean up the whole codebase under
# strict mypy.  Scoping to `_redesign/` lets us enforce TypedDict
# contracts on the per-feature route modules (catches "bounded fallback
# missing a key from the template's expected payload shape" at lint
# time instead of at template-render time in prod).  Expanding scope
# is a future task.
[tool.mypy]
python_version = "3.12"
files = ["src/filings/routers/_redesign"]
# Don't require type hints on every function -- only TypedDict-annotated
# returns get checked.  Gradual-typing posture.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = false
