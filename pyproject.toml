[project]
name = "13f-project"
version = "0.1.0"
description = "CLI tool to view SEC 13F institutional holdings filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.13",
    "rich>=13.0",
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "finnhub-python>=2.4",
    "yfinance>=0.2",
    "slowapi>=0.1.9",
    "gunicorn>=22.0",
    "sentry-sdk[fastapi]>=2.0",
    "supabase>=2.0",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "stripe>=9.0",
    "svix>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[project.scripts]
filings = "filings.cli:main"
filings-web = "filings.web:main"
filings-sync = "filings.sync_worker:main"
filings-insider-sync = "filings.insider_sync:main"
filings-youtube-sync = "filings.youtube_sync:main"
filings-migrate-cold = "filings.migrate_cold_storage:main"
filings-insider-backfill = "filings.insider_backfill:main"
filings-insider-returns = "filings.insider_returns:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings"]
artifacts = ["src/filings/static/*", "src/filings/templates/**/*"]
