{% extends "base.html" %}

{% block title %}Sign Up — PaperPanda{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4em 1em;">
    <p style="color: var(--pp-text-muted);">Opening sign-up...</p>
</div>
<script>
(function() {
    function tryOpen() {
        if (window.Clerk && window.Clerk.loaded) {
            window.Clerk.openSignUp({
                afterSignInUrl: '/',
                afterSignUpUrl: '/',
            });
        } else {
            setTimeout(tryOpen, 100);
        }
    }
    tryOpen();
})();
</script>
{% endblock %}
