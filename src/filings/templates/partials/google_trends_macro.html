{# ── Macro trend chart partial for one category (loaded via hx-get) ── #}

{% if trend_data and trend_data.data %}
<div class="gt-chart-container" style="height: 140px;">
    <canvas id="gt-macro-{{ chart_id }}"></canvas>
</div>
<script>
(function() {
    var ctx = document.getElementById('gt-macro-{{ chart_id }}');
    if (!ctx || typeof Chart === 'undefined') return;

    var raw = {{ trend_data.data | tojson }};
    var keywords = {{ trend_data.keywords | tojson }};
    var colors = ['#1976d2', '#e65100', '#2e7d32', '#7b1fa2', '#c62828'];

    var labels = raw.map(function(d) { return d.date; });
    var datasets = keywords.map(function(kw, i) {
        return {
            label: kw,
            data: raw.map(function(d) { return d.values[kw] || 0; }),
            borderColor: colors[i % colors.length],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            fill: false,
        };
    });

    new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: { size: 10 }, padding: 8 } },
                tooltip: {
                    callbacks: {
                        label: function(ctx) { return ctx.dataset.label + ': ' + ctx.parsed.y; }
                    }
                }
            },
            scales: {
                x: { display: true, ticks: { maxTicksLimit: 6, font: { size: 9 }, color: '#999' }, grid: { display: false } },
                y: { display: true, min: 0, max: 100, ticks: { font: { size: 9 }, color: '#999', stepSize: 25 }, grid: { color: 'rgba(0,0,0,0.04)' } }
            }
        }
    });
})();
</script>
{% else %}
<div style="height: 140px; display: flex; align-items: center; justify-content: center; color: var(--pp-sub-text-light); font-size: 0.82em;">
    Data temporarily unavailable
</div>
{% endif %}
