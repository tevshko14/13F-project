{# Bell icon with red dot indicator — returned by /api/notifications/bell #}
<button class="pp-bell-btn"
        onclick="ppToggleNotifDropdown(this)"
        aria-label="Notifications"
        title="Notifications">
  <svg class="pp-bell-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>
  {% if count > 0 %}
  <span class="pp-bell-dot"></span>
  {% endif %}
</button>
