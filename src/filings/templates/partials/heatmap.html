{# S&P 500 heatmap partial — loaded asynchronously via HTMX #}
<article id="heatmap-article">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <strong>S&P 500 Market Heatmap</strong>
            <span class="text-muted" style="margin-left: 0.5em; font-weight: normal;">
                {{ metadata.count }} stocks &middot; Updated {{ metadata.fetched_at }}
            </span>
        </div>
        <small class="text-muted">
            <span style="border: 2px solid #FFD700; padding: 0 0.3em; font-size: 0.85em;">Gold border</span>
            = held by superinvestors
        </small>
    </header>
    <div id="heatmap-container" style="width: 100%; height: 500px;"></div>
</article>

<script>
(function() {
    var heatmapData = {{ heatmap_json | safe }};
    var container = document.getElementById('heatmap-container');
    if (!container || !heatmapData || heatmapData.length === 0) return;

    var chart = echarts.init(container);

    chart.setOption({
        tooltip: {
            formatter: function(info) {
                var d = info.data;
                if (!d || d.pct_change === undefined) {
                    return info.name;
                }
                var sign = d.pct_change >= 0 ? '+' : '';
                var color = d.pct_change >= 0 ? '#2e7d32' : '#c62828';
                var superTag = d.held_by_superinvestors
                    ? '<br/><span style="color: #FFD700;">&#9733; Held by superinvestors</span>'
                    : '';
                return '<strong>' + d.name + '</strong>'
                    + '<br/>' + (d.full_name || '')
                    + '<br/><span style="color:' + color + '; font-size: 1.1em; font-weight: bold;">'
                    + sign + d.pct_change.toFixed(2) + '%</span>'
                    + superTag;
            }
        },
        series: [{
            type: 'treemap',
            data: heatmapData,
            width: '100%',
            height: '100%',
            roam: false,
            nodeClick: false,
            breadcrumb: { show: false },
            levels: [
                {
                    itemStyle: {
                        borderColor: 'rgba(0,0,0,0.4)',
                        borderWidth: 2,
                        gapWidth: 2
                    },
                    upperLabel: {
                        show: true,
                        height: 22,
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#fff',
                        backgroundColor: 'rgba(0,0,0,0.25)',
                        padding: [2, 6]
                    }
                },
                {
                    label: {
                        show: true,
                        formatter: function(params) {
                            var d = params.data;
                            if (!d || d.pct_change === undefined) return params.name;
                            var sign = d.pct_change >= 0 ? '+' : '';
                            return d.name + '\n' + sign + d.pct_change.toFixed(1) + '%';
                        },
                        fontSize: 10,
                        color: '#fff',
                        textShadowColor: 'rgba(0,0,0,0.5)',
                        textShadowBlur: 2
                    },
                    itemStyle: {
                        gapWidth: 1
                    }
                }
            ]
        }]
    });

    // Click stock → navigate to stock page
    chart.on('click', function(params) {
        if (params.data && params.data.link) {
            window.location.href = params.data.link;
        }
    });

    // Responsive resize
    window.addEventListener('resize', function() { chart.resize(); });

    // Re-init sortable tables if any were loaded
    if (window.initSortableTables) window.initSortableTables();
})();
</script>
