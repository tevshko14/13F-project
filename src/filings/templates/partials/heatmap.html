{# S&P 500 heatmap partial — loaded asynchronously via HTMX #}
{% set period_label = metadata.get("period_label", "today") if metadata.get("period_label") else "today" %}
<article id="heatmap-article" class="heatmap-fadein">
    <div class="heatmap-meta">
        {{ metadata.count }} stocks · Change {{ period_label }} · Updated {{ metadata.fetched_at }}
    </div>
    <div id="heatmap-container" style="width: 100%; height: 500px;"></div>
</article>

<style>
    @keyframes heatmapFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .heatmap-fadein {
        animation: heatmapFadeIn 0.35s ease-out;
    }
</style>

<script>
(function() {
    var heatmapData = {{ heatmap_json | safe }};
    var periodLabel = {{ period_label | tojson }};
    var container = document.getElementById('heatmap-container');
    if (!container || !heatmapData || heatmapData.length === 0) return;

    window._ppLazyChart(container, function() {
    window.requireECharts(function(err) {
    if (err) { container.innerHTML = '<p class="text-muted" style="text-align:center;padding:2em;">Chart unavailable</p>'; return; }

    // Dispose previous chart instance if it exists (HTMX re-render)
    var existing = echarts.getInstanceByDom(container);
    if (existing) existing.dispose();

    var chart = echarts.init(container);
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var borderColor = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.4)';
    var labelBg = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.25)';

    // ── Color helper for pct_change ──
    function pctColor(p) {
        if (p > 2) return '#1b5e20';
        if (p > 1) return '#2e7d32';
        if (p > 0.5) return '#388e3c';
        if (p > 0) return '#4caf50';
        if (p > -0.5) return '#ef5350';
        if (p > -1) return '#e53935';
        if (p > -2) return '#c62828';
        return '#b71c1c';
    }

    // ── Sector aggregation helper (defined early so initial render can use it) ──
    // Bakes sector name + pct into the `name` field with \n so ECharts treemap
    // renders both on two lines natively (formatter-based \n doesn't work).
    function buildSectorView(data) {
        return data.map(function(sector) {
            var totalWeight = 0, weightedPct = 0, superCount = 0;
            (sector.children || []).forEach(function(c) {
                var w = c.value || 0;
                totalWeight += w;
                weightedPct += (c.pct_change || 0) * w;
                superCount += (c.superinvestor_count || 0);
            });
            var avgPct = totalWeight > 0 ? weightedPct / totalWeight : 0;
            var sign = avgPct >= 0 ? '+' : '';
            return {
                name: sector.name + '\n' + sign + avgPct.toFixed(2) + '%',
                value: totalWeight,
                pct_change: avgPct,
                full_name: sector.name + ' (' + (sector.children || []).length + ' stocks)',
                superinvestor_count: superCount,
                itemStyle: {
                    color: pctColor(avgPct),
                    borderColor: isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.3)',
                    borderWidth: 2,
                }
            };
        });
    }

    var _sectorLevels = [{
        label: {
            show: true,
            fontSize: 14,
            fontWeight: 'bold',
            color: '#fff',
            align: 'center',
            verticalAlign: 'middle',
            textShadowColor: 'rgba(0,0,0,0.6)',
            textShadowBlur: 3,
        },
        upperLabel: { show: false },
        itemStyle: { gapWidth: 3, borderColor: isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.4)', borderWidth: 2 }
    }];

    var _companyLevels = [
        {
            itemStyle: { borderColor: borderColor, borderWidth: 2, gapWidth: 2 },
            upperLabel: { show: true, height: 22, fontSize: 11, fontWeight: 'bold', color: '#fff', backgroundColor: labelBg, padding: [2, 6] }
        },
        {
            label: {
                show: true,
                formatter: function(params) {
                    var d = params.data;
                    if (!d || d.pct_change === undefined) return params.name;
                    var sign = d.pct_change >= 0 ? '+' : '';
                    var text = d.name + '\n' + sign + d.pct_change.toFixed(1) + '%';
                    if (d.superinvestor_count > 0) text += '\n(' + d.superinvestor_count + ' supers)';
                    return text;
                },
                fontSize: 10, color: '#fff', textShadowColor: 'rgba(0,0,0,0.5)', textShadowBlur: 2
            },
            itemStyle: { gapWidth: 1 }
        }
    ];

    // Initialize with sector view (default); cache result to avoid recomputation
    var _sectorCache = buildSectorView(heatmapData);

    chart.setOption({
        animation: false,
        tooltip: {
            appendToBody: true,
            confine: true,
            formatter: function(info) {
                var d = info.data;
                if (!d || d.pct_change === undefined) {
                    return info.name;
                }
                var sign = d.pct_change >= 0 ? '+' : '';
                var color = d.pct_change >= 0 ? '#2e7d32' : '#c62828';
                var superTag = '';
                if (d.superinvestor_count > 0) {
                    superTag = '<br/><span style="color: #FFD700;">&#9733; Held by '
                        + d.superinvestor_count + ' superinvestor'
                        + (d.superinvestor_count > 1 ? 's' : '') + '</span>';
                }
                // Use full_name if available (sector view), else name
                var displayName = d.full_name || d.name.split('\n')[0];
                return '<strong>' + displayName + '</strong>'
                    + '<br/><span style="color:' + color + '; font-size: 1.1em; font-weight: bold;">'
                    + sign + d.pct_change.toFixed(2) + '% ' + periodLabel + '</span>'
                    + superTag;
            }
        },
        series: [{
            type: 'treemap',
            data: _sectorCache,
            width: '100%',
            height: '100%',
            roam: false,
            nodeClick: false,
            breadcrumb: { show: false },
            levels: _sectorLevels
        }]
    });

    // Click stock → navigate to stock page
    chart.on('click', function(params) {
        if (params.data && params.data.link) {
            window.location.href = params.data.link;
        }
    });

    var _currentView = 'sectors';
    var _rawData = heatmapData;

    window._ppSwitchHeatmapView = function(view) {
        _currentView = view;
        if (view === 'sectors') {
            chart.setOption({ animation: true, series: [{ data: _sectorCache, levels: _sectorLevels }] });
        } else {
            chart.setOption({ animation: true, series: [{ data: _rawData, levels: _companyLevels }] });
        }
    };

    window._ppUpdateHeatmap = function(newData, newPeriodLabel) {
        periodLabel = newPeriodLabel;
        _rawData = newData;
        _sectorCache = buildSectorView(newData);  // rebuild cache for new period
        window._ppSwitchHeatmapView(_currentView);
    };

    // Responsive resize (global debounced handler)
    if (window._ppRegisterResize) window._ppRegisterResize(function() { chart.resize(); });

    // Re-init sortable tables if any were loaded
    if (window.initSortableTables) window.initSortableTables();
    }); // end requireECharts
    }); // end _ppLazyChart
})();
</script>
