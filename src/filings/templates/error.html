{% extends "base.html" %}
{% block title %}Error - PaperPanda{% endblock %}
{% block meta_description %}An error occurred on PaperPanda.{% endblock %}
{% block content %}
<article style="text-align: center; padding: 3em 1em;">
    <h2>Something went wrong</h2>
    <p style="max-width: 500px; margin: 0 auto 1.5em;">{{ message }}</p>
    <div style="display: flex; gap: 0.5em; justify-content: center;">
        <a href="/" role="button">Superinvestors</a>
        <a href="/activity" role="button" class="secondary">Activity Feed</a>
        <a href="/search" role="button" class="secondary outline">Search</a>
    </div>
</article>
{% endblock %}
