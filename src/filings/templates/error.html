{% extends "base.html" %}
{% block title %}Error - PaperPanda{% endblock %}
{% block meta_description %}An error occurred on PaperPanda.{% endblock %}
{% block extra_head_scripts %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
{% endblock %}
{% block content %}
<style>
  main.container {
    max-width: 600px !important;
    width: 100% !important;
    padding-left: 1.5rem !important;
    padding-right: 1.5rem !important;
  }
  .error-shell {
    --error-ink: #0f172a;
    position: relative;
    isolation: isolate;
    font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    padding-bottom: 2rem;
  }
  .error-aurora {
    position: absolute;
    border-radius: 999px;
    filter: blur(56px);
    opacity: 0.54;
    pointer-events: none;
    z-index: -1;
  }
  .error-aurora-one {
    width: min(40vw, 420px);
    height: min(34vw, 360px);
    top: -70px;
    left: -80px;
    background: radial-gradient(circle at 35% 30%, rgba(249, 115, 22, 0.24), rgba(180, 83, 9, 0.06) 72%);
  }
  .error-aurora-two {
    width: min(36vw, 380px);
    height: min(30vw, 320px);
    top: 20px;
    right: -70px;
    background: radial-gradient(circle at 60% 40%, rgba(13, 148, 136, 0.22), rgba(15, 118, 110, 0.08) 72%);
  }
  .error-hero {
    text-align: center;
    border-radius: 24px;
    padding: 2.2rem 1.8rem 2rem;
    border: 1px solid rgba(255, 255, 255, 0.34);
    background:
      linear-gradient(132deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.5)),
      radial-gradient(circle at 8% 12%, rgba(14, 165, 233, 0.14), transparent 48%),
      radial-gradient(circle at 92% 12%, rgba(45, 212, 191, 0.12), transparent 45%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 18px 46px rgba(15, 23, 42, 0.12);
  }
  .error-emoji {
    font-size: 3.2rem;
    line-height: 1;
    margin-bottom: 0.6rem;
    display: block;
  }
  .error-hero h1 {
    margin: 0 0 0.6rem;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-family: "Fraunces", Georgia, serif;
    letter-spacing: -0.03em;
    line-height: 1.08;
    color: var(--error-ink);
  }
  .error-message {
    margin: 0 auto 1.6rem;
    color: rgba(15, 23, 42, 0.7);
    font-size: 0.95rem;
    max-width: 38ch;
    line-height: 1.55;
  }
  .error-actions {
    display: flex;
    gap: 0.75em;
    justify-content: center;
    flex-wrap: wrap;
  }
  .error-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    padding: 0.65em 1.4em;
    font-size: 0.9em;
    font-weight: 600;
    border-radius: 10px;
    text-decoration: none;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .error-btn-primary {
    background: linear-gradient(120deg, #0f766e, #0d9488);
    border: 1px solid #0d9488;
    color: #fff;
  }
  .error-btn-primary:hover {
    background: linear-gradient(120deg, #0d9488, #14b8a6);
    border-color: #14b8a6;
    color: #fff;
  }
  .error-btn-outline {
    background: transparent;
    border: 1px solid rgba(15, 23, 42, 0.18);
    color: rgba(15, 23, 42, 0.72);
  }
  .error-btn-outline:hover {
    background: rgba(13, 148, 136, 0.08);
    border-color: #0d9488;
    color: #0f766e;
  }

  /* ── Dark mode ── */
  :root[data-theme="dark"] .error-shell { --error-ink: #e2e8f0; }
  :root[data-theme="dark"] .error-hero {
    border-color: rgba(148, 163, 184, 0.22);
    background:
      linear-gradient(130deg, rgba(15, 23, 42, 0.86), rgba(15, 23, 42, 0.66)),
      radial-gradient(circle at 8% 12%, rgba(14, 165, 233, 0.14), transparent 48%),
      radial-gradient(circle at 92% 12%, rgba(45, 212, 191, 0.12), transparent 45%);
  }
  :root[data-theme="dark"] .error-message {
    color: rgba(226, 232, 240, 0.72);
  }
  :root[data-theme="dark"] .error-btn-outline {
    border-color: rgba(148, 163, 184, 0.3);
    color: rgba(226, 232, 240, 0.72);
  }
  :root[data-theme="dark"] .error-btn-outline:hover {
    background: rgba(13, 148, 136, 0.16);
    border-color: #2dd4bf;
    color: #5eead4;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    main.container {
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }
    .error-hero {
      border-radius: 20px;
      padding: 1.8rem 1.2rem 1.6rem;
    }
    .error-actions {
      flex-direction: column;
      align-items: center;
    }
    .error-btn {
      width: 100%;
      justify-content: center;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .error-btn { transition: none !important; }
  }
</style>

<section class="error-shell">
<div class="error-aurora error-aurora-one" aria-hidden="true"></div>
<div class="error-aurora error-aurora-two" aria-hidden="true"></div>

<div class="error-hero">
  <span class="error-emoji">🐼</span>
  <h1>Something went wrong</h1>
  <p class="error-message">{{ message }}</p>
  <div class="error-actions">
    <a href="/" class="error-btn error-btn-primary">Home</a>
    <a href="/funds" class="error-btn error-btn-outline">Top Funds</a>
  </div>
</div>
</section>
{% endblock %}
