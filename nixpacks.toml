[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install hatchling", "pip install ."]

[start]
cmd = "gunicorn filings.web:app --bind 0.0.0.0:${PORT:-8000} --workers ${WEB_WORKERS:-1} --worker-class uvicorn.workers.UvicornWorker --timeout 120 --graceful-timeout 30 --preload --access-logfile -"
